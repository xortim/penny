services:
  penny:
    build: ./src
    command: serve --config /penny.yaml
    ports:
      - "3000:3000"
    volumes:
      - ./config/penny.yaml:/penny.yaml
    depends_on:
      mariadb:
        condition: service_healthy
    restart: on-failure:5

  mariadb:
    image: "mariadb:10.5"
    ports:
      - "3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: pass-root
      MARIADB_DATABASE: penny
      MARIADB_USER: penny
      MARIADB_PASSWORD: pass
    volumes:
      - ./db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
